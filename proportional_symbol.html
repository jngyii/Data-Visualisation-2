<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/vega@5.22.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.2.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.20.8"></script>
</head>
<body>
  <div id="vis"></div>
  <script>
    const spec = {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "title": {
        "text": "Number of Schools per Region",
        "fontSize": 18
      },
      "width": 550,
      "height": 450,
      "config": {
        "view": {
          "stroke": "transparent"
        }
      },
      "data": {
        "url": "https://raw.githubusercontent.com/jngyii/FIT3179/refs/heads/main/data%20for%20assignment2/Counts%20of%20all%20Schools%20cleaned.csv",
        "format": {"type": "csv"}
      },
      "projection": {"type": "mercator"},
      "layer": [
        {
          "data": {
            "url": "https://raw.githubusercontent.com/jngyii/FIT3179/refs/heads/main/data%20for%20assignment2/STE_2021_AUST_GDA94.json",
            "format": {"type": "topojson", "feature": "STE_2021_AUST_GDA94"}
          },
          "mark": {"type": "geoshape", "fill": "lightblue", "stroke": "white"}
        },
        {
          "selection": {
            "type_select": {"type": "multi", "fields": ["Type"], "bind": "legend"}
          },
          "mark": {"type": "circle", "tooltip": {"content": "data"}},
          "encoding": {
            "longitude": {"field": "Longitude", "type": "quantitative"},
            "latitude": {"field": "Latitude", "type": "quantitative"},
            "size": {
              "field": "Enrollment",
              "type": "quantitative",
              "title": "No of Schools",
              "scale": {"domain": [0, 2500], "range": [100, 3000]},
              "legend": null
            },
            "color": {
              "field": "Type",
              "type": "nominal",
              "title": "School Type",
              "scale": {"scheme": "category10"},
              "legend": {
                "title": "School Type",
                "labelFontSize": 12,
                "titleFontSize": 14
              }
            },
            "opacity": {
              "condition": {"selection": "type_select", "value": 0.8},
              "value": 0
            },
            "tooltip": [
              {"field": "State", "type": "nominal", "title": "State"},
              {"field": "Type", "type": "nominal", "title": "School Type"},
              {"field": "Enrollment", "type": "quantitative", "title": "No of Schools"}
            ]
          }
        }
      ]
    };

    vegaEmbed("#vis", spec).then(function(result) {
      // Set initial selection to "Total"
      result.view.signal("type_select", [{"Type": "Total"}]).run();
    }).catch(console.warn);
  </script>
</body>
</html>
